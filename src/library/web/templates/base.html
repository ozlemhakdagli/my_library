<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Personal Library</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="/">{{ t("nav_books") }}</a>
      <a href="/loans">{{ t("nav_loans") }}</a>
      <a href="/review">{{ t("nav_review") }}</a>
      <a href="/shelves">{{ t("nav_shelves") }}</a>
      <a href="/types">{{ t("nav_types") }}</a>
      <a href="/settings">{{ t("nav_settings") }}</a>
    </nav>
    <div class="lang">
      {% for code in languages %}
        {% if code == lang %}
          <strong>{{ code | upper }}</strong>
        {% else %}
          <a href="{{ lang_url(code) }}">{{ code | upper }}</a>
        {% endif %}
      {% endfor %}
    </div>
  </header>
  <main class="mx-auto w-full max-w-6xl px-4 py-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
